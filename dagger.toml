# The e2e checks run on the engine that runs dagger check: in CI, the latest
# Dagger release.

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.dang-sdk]
source = "dagger.io/sdk/dang"

[sdks.dang]
module = "dang-sdk"

[modules.go-sdk-dev]
main = true
source = ".dagger/modules/go-sdk-dev"

[sdks.dang.scopes.".dagger/modules/go-sdk-dev"]
is-module = true
