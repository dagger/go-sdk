defaultTarget = "v1.0.0-beta.27"
sourcesFloor = "v1.0.0-beta.18"
# The dagger/go that generated entrypoint modules build with (daggerGo): the
# per-package build's branch until a dagger/go release carries it.
daggerGo = "github.com/dagger/go@78c403972edce6813bc6fb1d686e8b45feaaf0e5"
# The first Dagger release whose manifests list an entrypoint's dependencies.
# v1.0.0-beta.25 does not.
daggerGoFloor = "v1.0.0-beta.26"
# The images generated entrypoints name, by digest, so that generated code
# changes only when this file does: the image a module's calls run in, and
# the Go image a go build entrypoint builds in for defaultGoVersion.
runtimeImage = "alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f"
goImage = "golang:1.27-alpine@sha256:d200d2dd76b03a99b52651fd1325aff7dcd35422c35c01bac56571b0507f3deb"
